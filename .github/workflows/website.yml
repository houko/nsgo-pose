name: Website

# Builds apps/website/ and the web build of the app, and publishes them to GitHub Pages, the app under app/, on pushes to main that touch either or the screenshots the site shows.

on:
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "apps/mirra/**"
      - "screenshots/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/mirra/go.mod
          cache-dependency-path: apps/mirra/go.sum

      - name: Build the web app
        working-directory: apps/mirra
        run: go tool nsgo build -target web

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install the website's dependencies
        working-directory: apps/website
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: apps/website
        run: bun run typecheck

      - name: Build the website
        working-directory: apps/website
        env:
          # The site's origin and path, for canonical links, Open Graph images and the sitemap: Pages serves it at the custom domain set in the repository's Pages settings, at the root. The token lets the build read stars, contributors and the latest release.
          SITE_URL: https://mirra.yldm.ai
          BASE_PATH: /
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build

      - name: Put the web app under app/
        run: |
          mkdir -p apps/website/dist/client/app
          cp -R apps/mirra/dist/Mirra-*-web/. apps/website/dist/client/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
