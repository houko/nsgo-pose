# Mirra's look: a dark studio with warm amber light. The app always shows it dark, so both appearances carry the same colors.
radius: 14
light: &mirra
  background: "#0e0d0c"
  surface: "#191816"
  text: "#f3efe8"
  textMuted: "#9b958b"
  border: "#2d2a26"
  accent: "#e3be86"
  accentText: "#1b1610"
  inset: "#23211e"
  success: "#7fd6a4"
  danger: "#f08b80"
dark: *mirra
